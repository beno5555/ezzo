<div class="flex min-h-0 flex-1 gap-4 lg:gap-6">
  <!-- The list: the whole screen at /messages on a phone, and the left-hand column on a desktop. -->
  <!-- One card, as tall as the conversation's: the rows scroll, and New message stays fixed at its
       bottom (owner, 2026-11-22). -->
  <section
    class="min-h-0 w-full flex-col overflow-hidden rounded-lg border border-border bg-surface-raised md:flex md:w-2/5 md:shrink-0 lg:w-1/3"
    [class.flex]="isOnList()"
    [class.hidden]="!isOnList()"
    aria-labelledby="messages-heading"
  >
    <!-- The shell's Messages link already says where the reader is, so only screen readers get the heading. -->
    <h1 id="messages-heading" class="sr-only">{{ text().pages.messages }}</h1>
    <app-conversation-list class="flex min-h-0 flex-1 flex-col" />
    <div class="border-t border-border p-2 md:px-4 md:py-3">
      <button appButton look="quiet" class="w-full" type="button" (click)="startConversation()">
        <svg class="size-5" lucideSquarePen aria-hidden="true"></svg>
        {{ text().messages.newMessage.openButton }}
      </button>
    </div>
  </section>

  <!-- The open conversation, or the hint that stands in for it on a desktop. -->
  <div
    class="min-h-0 min-w-0 flex-1 flex-col md:flex"
    [class.flex]="!isOnList()"
    [class.hidden]="isOnList()"
  >
    <router-outlet />
  </div>
</div>
