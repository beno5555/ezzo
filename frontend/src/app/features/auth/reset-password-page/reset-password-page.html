<app-auth-frame [heading]="text().auth.resetPassword.title" [lead]="text().auth.resetPassword.lead">
  @if (hasToken()) {
    <form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="resetPassword()">
      <app-form-field
        fieldId="newPassword"
        [label]="text().auth.resetPassword.passwordLabel"
        [hint]="text().auth.passwordHint(limits.passwordMinLength)"
        [control]="form.controls.newPassword"
      >
        <input
          appTextInput
          id="newPassword"
          type="password"
          autocomplete="new-password"
          formControlName="newPassword"
        />
      </app-form-field>

      @if (failureMessage(); as message) {
        <app-form-message tone="danger" [message]="message" />
      }

      <button appButton look="primary" type="submit" [disabled]="form.invalid || isSubmitting()">
        {{ text().auth.resetPassword.submitButton }}
      </button>
    </form>
  } @else {
    <app-form-message tone="danger" [message]="text().auth.resetPassword.missingToken" />
  }

  <p authLink class="flex flex-wrap items-center gap-x-1">
    {{ text().auth.resetPassword.newLinkPrompt }}
    <a appTextLink [routerLink]="addresses.forgotPassword">{{
      text().auth.resetPassword.newLinkLink
    }}</a>
  </p>
  <p authLink class="flex flex-wrap items-center gap-x-1">
    {{ text().auth.resetPassword.signInPrompt }}
    <a appTextLink [routerLink]="addresses.signIn">{{ text().auth.signInLink }}</a>
  </p>
</app-auth-frame>
