<app-auth-frame
  [heading]="text().auth.forgotPassword.title"
  [lead]="text().auth.forgotPassword.lead"
>
  @if (sentTo(); as email) {
    <app-form-message tone="success" [message]="text().auth.forgotPassword.sent(email)" />
  } @else {
    <form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="sendLink()">
      <app-form-field
        fieldId="email"
        [label]="text().auth.forgotPassword.emailLabel"
        [control]="form.controls.email"
      >
        <input
          appTextInput
          id="email"
          type="email"
          autocomplete="email"
          spellcheck="false"
          formControlName="email"
        />
      </app-form-field>

      @if (failureMessage(); as message) {
        <app-form-message tone="danger" [message]="message" />
      }

      <button appButton look="primary" type="submit" [disabled]="form.invalid || isSubmitting()">
        {{ text().auth.forgotPassword.submitButton }}
      </button>
    </form>
  }

  <p appAuthLink>
    {{ text().auth.forgotPassword.signInPrompt }}
    <a appTextLink [routerLink]="addresses.signIn">{{ text().auth.signInLink }}</a>
  </p>
</app-auth-frame>
