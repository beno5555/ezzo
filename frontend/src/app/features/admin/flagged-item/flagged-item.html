<article
  class="flex flex-col gap-4 rounded-lg border border-border bg-surface-raised p-4 text-ink-strong"
  [appFadeOut]="isFading()"
  [attr.aria-busy]="isFading() || null"
>
  <ng-content />
  <div class="flex flex-wrap gap-2">
    <button appButton look="danger" type="button" (click)="requestHide()">
      {{ text().admin.moderation.hideButton }}
    </button>
    <button appButton look="quiet" type="button" (click)="requestMakeVisible()">
      {{ text().admin.moderation.makeVisibleButton }}
    </button>
  </div>
</article>
