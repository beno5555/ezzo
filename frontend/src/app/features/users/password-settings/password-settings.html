<app-settings-section
  headingId="settings-password"
  [heading]="text().users.settings.password.heading"
>
  <p class="text-ink-muted">{{ text().users.settings.password.description }}</p>

  @if (sentTo(); as email) {
    <app-form-message tone="success" [message]="text().users.settings.password.sent(email)" />
  }

  <button
    appButton
    look="quiet"
    type="button"
    class="md:self-start"
    [disabled]="isSending()"
    (click)="sendLink()"
  >
    {{ text().users.settings.password.requestButton }}
  </button>
</app-settings-section>
