<h1>{{ text().app.name }}</h1>

<form [formGroup]="form" (ngSubmit)="search()">
  <label for="username">{{ text().users.search.label }}</label>
  <input id="username" type="search" formControlName="username" />
  <button type="submit" [disabled]="form.invalid">{{ text().users.search.submitButton }}</button>
</form>

@if (failureMessage(); as message) {
  <p role="alert">{{ message }}</p>
}

@if (users().length > 0) {
  <p>{{ text().users.search.shown(users().length) }}</p>
}

<ul>
  @for (user of users(); track user.username) {
    <li>{{ user.username }}</li>
  }
</ul>
