<div class="flex flex-col gap-4">
  <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
    <h1 class="font-display text-2xl text-ink-strong">{{ text().friendships.page.heading }}</h1>
    <a appButton look="primary" [routerLink]="searchAddress">
      <svg class="size-5" lucideSearch aria-hidden="true"></svg>
      {{ text().friendships.page.findFriendsButton }}
    </a>
  </div>

  <app-tabs
    [idPrefix]="tabsIdPrefix"
    [tabs]="tabs()"
    [label]="text().friendships.page.tabsLabel"
    [selected]="selectedTab()"
    (selectedChange)="select($event)"
  />

  @for (tab of tabKeys; track tab) {
    <div
      role="tabpanel"
      tabindex="0"
      [id]="panelIdOf(tabsIdPrefix, tab)"
      [attr.aria-labelledby]="tabIdOf(tabsIdPrefix, tab)"
      [hidden]="selectedTab() !== tab"
    >
      <app-friend-list
        [list]="store.list(tab)"
        [texts]="text().friendships.page.lists[tab]"
        [retryLabel]="text().friendships.page.retryButton"
        [actions]="actionsOfTab[tab]"
        [canMessage]="tab === FriendsTab.Friends"
        [waitingIds]="store.waitingIds()"
        [fadingIds]="store.fadingIds()"
        (action)="perform($event.action, $event.friendship)"
        (more)="loadMore(tab)"
      />
    </div>
  }
</div>
