<div class="flex flex-col gap-6">
  <a appButton look="quiet" class="self-start" [routerLink]="feedAddress">
    <svg class="size-5 shrink-0" lucideArrowLeft aria-hidden="true"></svg>
    {{ text().posts.page.backLink }}
  </a>

  <h1 class="font-display text-2xl text-ink-strong">{{ text().pages.newPost }}</h1>

  <app-post-composer (send)="publish($event)" />
</div>
