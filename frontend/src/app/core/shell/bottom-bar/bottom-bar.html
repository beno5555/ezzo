@if (shownFor(); as signedInUser) {
  <div class="h-16" aria-hidden="true"></div>

  <nav
    class="fixed inset-x-0 bottom-0 z-10 border-t border-border bg-surface-raised shadow-raised"
    [attr.aria-label]="text().shell.navigationLabel"
  >
    <!-- Each cell starts at its word's width and shares out the rest, so a long word takes room from a
         short one; a word that still does not fit is cut with an ellipsis. -->
    <ul class="mx-auto flex h-16 max-w-column">
      <li class="flex min-w-0 flex-auto">
        <a appBottomBarLink [routerLink]="addresses.feed">
          <svg class="size-6 shrink-0" lucideHouse aria-hidden="true"></svg>
          <span class="max-w-full truncate">{{ text().shell.bottomBar.feedLink }}</span>
        </a>
      </li>
      <li class="flex min-w-0 flex-auto">
        <a appBottomBarLink [routerLink]="addresses.search">
          <svg class="size-6 shrink-0" lucideSearch aria-hidden="true"></svg>
          <span class="max-w-full truncate">{{ text().shell.bottomBar.searchLink }}</span>
        </a>
      </li>
      <li class="flex min-w-0 flex-auto">
        <a appBottomBarLink [routerLink]="addresses.friends">
          <span class="relative flex">
            <svg class="size-6 shrink-0" lucideUsers aria-hidden="true"></svg>
            <app-count-badge
              class="absolute -end-4 -top-2"
              [text]="waitingBadge()"
              [labelFor]="text().shell.waitingBadge"
            />
          </span>
          <span class="max-w-full truncate">{{ text().shell.bottomBar.friendsLink }}</span>
        </a>
      </li>
      <li class="flex min-w-0 flex-auto">
        <a appBottomBarLink [routerLink]="addresses.messages">
          <span class="relative flex">
            <svg class="size-6 shrink-0" lucideMessageCircle aria-hidden="true"></svg>
            <app-count-badge
              class="absolute -end-4 -top-2"
              [text]="unreadBadge()"
              [labelFor]="text().shell.unreadBadge"
            />
          </span>
          <span class="max-w-full truncate">{{ text().shell.bottomBar.messagesLink }}</span>
        </a>
      </li>
      <li class="flex min-w-0 flex-auto">
        <a appBottomBarLink [routerLink]="addresses.profile(signedInUser.username)">
          <svg class="size-6 shrink-0" lucideUserRound aria-hidden="true"></svg>
          <span class="max-w-full truncate">{{ text().shell.bottomBar.profileLink }}</span>
        </a>
      </li>
    </ul>
  </nav>
}
