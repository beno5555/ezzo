<!-- Fixed to the window and behind every page (-z-10), so the page's cards cover it as they scroll over it.
     The name is drawn as on the landing page (same box, same letter positions, measured in the face);
     here every letter is the stamp tone and the "zz" is cut out of the logo's bubble in the page colour.
     Tilted about the bottom-left corner, which sits below and left of the window, so only part of the
     name shows: a phone shows less of it, as the cards fill the width. -->
<div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
  <svg
    class="absolute -bottom-1/12 -left-1/12 w-3/2 origin-bottom-left -rotate-9 md:-bottom-1/6 md:w-9/10"
    viewBox="0 -57 217 81"
  >
    <path
      class="fill-stamp"
      d="M67 -56h76a16 16 0 0 1 16 16v34a16 16 0 0 1-16 16H83l-16 13v-13a16 16 0 0 1-16-16v-34a16 16 0 0 1 16-16z"
    />
    <g class="font-wordmark" font-size="100">
      <text class="fill-stamp">e</text>
      <text class="fill-stamp" x="164">o</text>
      <text class="fill-surface-page" x="59">zz</text>
    </g>
  </svg>
</div>
