@if (showsPicture()) {
  <img
    class="size-full rounded-full object-cover"
    alt=""
    [src]="pictureAddress()"
    (error)="onPictureError()"
  />
} @else {
  <span
    class="flex size-full items-center justify-center overflow-hidden rounded-full bg-surface-sunken"
    [class]="ring()"
  >
    <svg class="size-3/4 fill-ink-muted text-ink-muted" lucideUserRound aria-hidden="true"></svg>
  </span>
}
