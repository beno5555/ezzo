<button
  appIconButton
  type="button"
  [attr.aria-label]="text().shared.passwordToggle.label"
  [attr.aria-pressed]="isShown()"
  [attr.aria-controls]="target().id || null"
  (click)="toggle()"
>
  <svg class="size-5" [appIcon]="isShown() ? icons.eye : icons.eyeOff" aria-hidden="true"></svg>
</button>
