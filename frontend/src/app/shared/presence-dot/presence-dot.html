<span class="sr-only">{{ label() }}</span>
@if (lastActiveAt() === null) {
  <span
    class="rounded-full bg-success ring-2 ring-surface-raised"
    [class]="dotSize()"
    aria-hidden="true"
  ></span>
} @else if (showsAwayTime() && awayFor(); as away) {
  <span
    class="flex h-4.5 min-w-4.5 items-center justify-center rounded-full bg-ink-muted px-1 text-xs font-semibold text-surface-raised ring-2 ring-surface-raised"
    aria-hidden="true"
    >{{ away }}</span
  >
} @else {
  <span
    class="rounded-full bg-ink-muted ring-2 ring-surface-raised"
    [class]="dotSize()"
    aria-hidden="true"
  ></span>
}
