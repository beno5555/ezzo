<div class="flex flex-col gap-1">
  <div class="flex flex-wrap items-center justify-between gap-x-4">
    <label class="py-1 text-sm font-semibold text-ink-strong" [for]="fieldId()">{{
      label()
    }}</label>
    <!-- The action keeps its 44 px touch target without making this row taller than a bare label. -->
    <div class="-my-1.5">
      <ng-content select="[fieldAction]" />
    </div>
  </div>
  <ng-content />
  @if (hint(); as hint) {
    <p class="text-sm text-ink-muted" [id]="hintId()">{{ hint }}</p>
  }
  @if (errorMessage(); as message) {
    <p class="flex items-start gap-1.5 text-sm text-danger" [id]="errorId()">
      <svg class="mt-0.5 size-4 shrink-0" lucideCircleExclamationPoint aria-hidden="true"></svg>
      {{ message }}
    </p>
  }
</div>
