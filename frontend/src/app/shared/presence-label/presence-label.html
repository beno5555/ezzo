@if (lastActiveAt(); as lastActive) {
  <span class="flex min-w-0 items-center gap-1.5 text-xs text-ink-muted">
    <span class="size-2 shrink-0 rounded-full bg-ink-muted" aria-hidden="true"></span>
    <span class="truncate">
      {{ text().shared.presence.lastActive(dateFormatter.timeSince(lastActive)) }}
    </span>
  </span>
} @else {
  <span class="inline-flex items-center gap-1.5 text-xs font-semibold text-success">
    <span class="size-2 shrink-0 rounded-full bg-success" aria-hidden="true"></span>
    {{ text().shared.presence.online }}
  </span>
}
