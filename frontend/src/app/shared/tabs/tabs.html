<div class="flex overflow-x-auto border-b border-border" role="tablist" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.key) {
    <button
      #tabButton
      type="button"
      role="tab"
      [id]="tabIdOf(tab.key)"
      [class]="classesOf(tab.key)"
      [attr.aria-selected]="tab.key === selected()"
      [attr.aria-controls]="panelIdOf(tab.key)"
      [attr.tabindex]="tab.key === selected() ? 0 : -1"
      (click)="select(tab.key)"
      (keydown)="onKeydown($event)"
    >
      {{ tab.label }}
    </button>
  }
</div>
